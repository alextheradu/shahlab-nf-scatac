repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-demux_logo_light.png
    - docs/images/nf-core-demux_logo_light.png
    - docs/images/nf-core-demux_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - LICENSE
    - .prettierignore
    - assets/sendmail_template.txt
    - .prettierignore
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  nf_test_content: false
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-demux_logo_light.png
    - docs/images/nf-core-demux_logo_light.png
    - docs/images/nf-core-demux_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - LICENSE
    - assets/multiqc_config.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - .prettierignore
    - .prettierrc.yml
  readme:
    - nextflow_badge
    - nfcore_template_badge
    - nextflow_badge

template:
  org: shahlab
  name: demux
  description: ATAC/WGS read demultiplexing for the DATAC single-cell co-assay
  author: Alex Radu
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - github_badges
    - license
    - ci
    - nf-test
    - igenomes
    - multiqc
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - code_linters
    - rocrate
    - email
  is_nfcore: false
